[package]
name = "localtusk"
version = "0.10.0"
description = "LocalTusk - ambientes PHP locais sem Docker"
authors = ["LocalTusk contributors"]
license = "MIT"
edition = "2024"

[lib]
name = "localtusk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
ureq = "3.5.1"
flate2 = "1.1.11"
tar = "0.4.46"
sha2 = "0.11.1"
regex = "1"
getrandom = "0.3.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Os pacotes do MySQL para Linux vêm em .tar.xz (compila o xz junto, sem depender do sistema).
[target.'cfg(target_os = "linux")'.dependencies]
liblzma = { version = "0.4", features = ["static"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
