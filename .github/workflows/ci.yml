name: CI

# Compila e testa o LocalTusk em macOS, Linux e Windows a cada push e pull request.
# Os testes ponta a ponta (marcados com #[ignore]) baixam PHP e MySQL e não rodam aqui.

on:
  push:
    # `windows` é a branch de trabalho do suporte ao Windows: o CI roda nela também.
    branches: [main, windows]
    paths-ignore: ["site/**", ".github/workflows/pages.yml"]
  pull_request:
    paths-ignore: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # Um sistema quebrar não deve esconder o resultado dos outros.
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
          - name: macOS (Intel)
            os: macos-15-intel
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Bibliotecas do Tauri no Linux (WebKitGTK e afins).
      - name: Dependências do Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Instalar dependências do front-end
        run: pnpm install --frozen-lockfile

      # O Tauri exige a pasta dist/ para compilar o back-end.
      - name: Front-end (tipos + build)
        run: pnpm build

      - name: Compilar o back-end (Rust)
        run: cargo check --locked --all-targets
        working-directory: src-tauri

      - name: Testes unitários
        run: cargo test --locked --lib
        working-directory: src-tauri
